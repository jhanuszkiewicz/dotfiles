# kitty - hypr preset (hswi swaps this file, see presets/files.txt)
# kitty instead of ghostty: ghostty made paneru's animation stutter every time
# its window slid off screen, kitty doesn't

# ---------- window ----------
# no titlebar, but macos keeps the rounded corners
hide_window_decorations titlebar-only
macos_titlebar_color background
# top right bottom left (or vertical horizontal)
window_padding_width 14 20
confirm_os_window_close 0
macos_quit_when_last_window_closed yes
macos_option_as_alt left
enable_audio_bell no
# tabs/splits live in tmux, so kitty's own tab bar stays hidden
tab_bar_style hidden

# see-through glass: wallpaper shows through, blurred
background_opacity 0.82
background_blur 24

# every window starts in tmux
shell /Users/jhan/.dotfiles/scripts/tmux-start

# ---------- font ----------
# departure mono: pixel font drawn on an 11px grid, so sizes that are
# multiples of 5.5pt stay sharp on retina (16.5 = 3x). it has only one weight,
# so bold/italic use the same face instead of a blurry fake bold
font_family      family="Departure Mono"
bold_font        family="Departure Mono"
italic_font      family="Departure Mono"
bold_italic_font family="Departure Mono"
font_size 16.5

# old font (to go back: comment out the block above, uncomment this one)
# font_family      family="CaskaydiaCove Nerd Font" style="Regular"
# bold_font        family="CaskaydiaCove Nerd Font" style="SemiBold"
# italic_font      family="CaskaydiaCove Nerd Font" style="Italic"
# bold_italic_font family="CaskaydiaCove Nerd Font" style="SemiBold Italic"
# font_size 17

# ---------- colors ----------
background #1e1e2e
foreground #cdd6f4
cursor #cba6f7
cursor_text_color #1e1e2e
selection_background #45475a
selection_foreground #cdd6f4
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# ---------- cursor ----------
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
# hide the mouse as soon as you type
mouse_hide_wait -1
# cursor trail, built into kitty (replaces the ghostty shader)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ---------- keys ----------
# kitty's default ctrl+shift shortcuts clash with nvim/tmux, so only the basics
clear_all_shortcuts yes
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+n new_os_window
map cmd+w close_os_window
map cmd+q quit
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
map ctrl+cmd+comma load_config_file
# caps lock = esc/ctrl in karabiner: esc can arrive while ctrl is still held, so treat ctrl+esc as plain esc
map ctrl+escape send_text all \x1b

# window title only in the window, not as an extra item in the macos menu bar
# (it showed up next to the app menus in sketchybar as ":: <title>")
macos_show_window_title_in window
