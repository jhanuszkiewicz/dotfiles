# kitty - minimalist preset (hswi swaps this file, see presets/files.txt)
# kitty instead of ghostty: ghostty made paneru's animation stutter every time
# its window slid off screen, kitty doesn't

# ---------- window ----------
# no titlebar and square corners
hide_window_decorations yes
macos_titlebar_color background
# top right bottom left (or vertical horizontal)
window_padding_width 16 20
confirm_os_window_close 0
macos_quit_when_last_window_closed no
macos_option_as_alt left
enable_audio_bell no
# tabs/splits live in tmux, so kitty's own tab bar stays hidden
tab_bar_style hidden

# every window starts in tmux
shell /Users/jhan/.dotfiles/scripts/tmux-start

# ---------- font ----------
# bitmap tamzen in bold as the regular weight, like in ghostty
font_family      family="Tamzen8x16" style="Bold"
bold_font        family="Tamzen8x16" style="Bold"
italic_font      auto
bold_italic_font auto
modify_font      cell_height -3px
font_size 20

# ---------- colors ----------
background #282828
foreground #d5c4a1
cursor #ebdbb2
selection_background #a89984
selection_foreground #282828
color0 #282828
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# ---------- cursor ----------
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
# hide the mouse as soon as you type
mouse_hide_wait -1

# ---------- keys ----------
# kitty's default ctrl+shift shortcuts clash with nvim/tmux, so only the basics
clear_all_shortcuts yes
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+n new_os_window
map cmd+w close_os_window
map cmd+q quit
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
map ctrl+cmd+comma load_config_file
# caps lock = esc/ctrl in karabiner: esc can arrive while ctrl is still held, so treat ctrl+esc as plain esc
map ctrl+escape send_text all \x1b

# window title only in the window, not as an extra item in the macos menu bar
# (it showed up next to the app menus in sketchybar as ":: <title>")
macos_show_window_title_in window
