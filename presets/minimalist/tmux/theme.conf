# tmux colors - minimalist (grey bar, teal tabs, pink/green current tab)
# this file is part of hswi presets (presets/files.txt)

set -g status-style "bg=#7c7c7c,fg=#282828"

# left: [session], right: host
# session name on the left, but hidden for numbered sessions (1, 2, 6...)
# named ones (main, tms project sessions) are still shown
set -g status-left '#{?#{m/r:^[0-9]+$,#{session_name}},,#[bg=#5a5a5a#,fg=#e0e0e0] [#S] #[default] }'
set -g status-left-length 30
set -g status-right "#[fg=#3a3a3a] #h "

# tabs
setw -g window-status-separator " "
setw -g window-status-format "#[bg=#458588,fg=#a8c8c8] #I  #W "
setw -g window-status-current-format "#[bg=#d3869b,fg=#8a4a5c] *#I #[bg=#8ec07c,fg=#ebdbb2,bold] [#W] "
setw -g window-status-activity-style "fg=#fabd2f"

# pane borders
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#83a598"

set -g message-style "bg=#3c3836,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#ebdbb2"

# popups (sessionizer, lazygit): darker background + thick accent border, so they stand out
# tmux 3.8+ has no popup-* options anymore (popups are floating panes now),
# so the colors live in user options and the binds in tmux.conf read them
set -g @popup-style "bg=#1d2021"
set -g @popup-border-style "fg=#83a598,bg=#1d2021"
