# tmux colors - tokyo-gruv (gruvbox dark)
# this file is part of hswi presets (presets/files.txt)

# bar background = terminal background, so it looks flat
set -g status-style "bg=#2a2522,fg=#928374"

# left: session name, right: nothing (clock is already in sketchybar)
# session name on the left, but hidden for numbered sessions (1, 2, 6...)
# named ones (main, tms project sessions) are still shown
set -g status-left '#{?#{m/r:^[0-9]+$,#{session_name}},,#[fg=#8f5e3b#,bold] #S #[default] }'
set -g status-left-length 30
set -g status-right ""

# tabs
setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#8f5e3b,fg=#ebdbb2,bold] #I #W "
setw -g window-status-activity-style "fg=#fabd2f"

# pane borders
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#8f5e3b"

# messages, command prompt and copy mode selection
set -g message-style "bg=#3c3836,fg=#ebdbb2"
setw -g mode-style "bg=#504945,fg=#ebdbb2"

# popups (sessionizer, lazygit): darker background + thick accent border, so they stand out
# tmux 3.8+ has no popup-* options anymore (popups are floating panes now),
# so the colors live in user options and the binds in tmux.conf read them
set -g @popup-style "bg=#211d1a"
set -g @popup-border-style "fg=#8f5e3b,bg=#211d1a"

# pane borders
set -g pane-border-indicators off
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#292e42"
