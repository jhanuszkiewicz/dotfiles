# tmux colors - tokyo night
# this file is part of hswi presets (presets/files.txt)

# bar background = terminal background, so it looks flat
set -g status-style "bg=#24283b,fg=#565f89"

# left: session name, right: nothing (clock is already in sketchybar)
set -g status-left "#[fg=#7aa2f7,bold] #S #[default] "
set -g status-left-length 30
set -g status-right ""

# tabs
setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I #W "
setw -g window-status-activity-style "fg=#e0af68"

# pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# messages, command prompt and copy mode selection
set -g message-style "bg=#292e42,fg=#c0caf5"
setw -g mode-style "bg=#3b4261,fg=#c0caf5"
