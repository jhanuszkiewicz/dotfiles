# tmux colors - hypr preset (catppuccin mocha)
# this file is part of hswi presets (presets/files.txt)

# bar background = default, so it stays see-through like the kitty window
set -g status-style "bg=default,fg=#6c7086"

# left: session name, right: nothing (clock is already in sketchybar)
# session name on the left, but hidden for numbered sessions (1, 2, 6...)
# named ones (main, tms project sessions) are still shown
set -g status-left '#{?#{m/r:^[0-9]+$,#{session_name}},,#[fg=#cba6f7#,bold] #S #[default] }'
set -g status-left-length 30
set -g status-right ""

# tabs - active one is a mauve chip, the rest plain text
setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold] #I #W #[default]"
setw -g window-status-activity-style "fg=#f9e2af"

# pane borders - one quiet line
set -g pane-border-indicators off
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#313244"

# messages, command prompt and copy mode selection
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"

# popups (sessionizer, lazygit): darker background + accent border, so they stand out
# tmux 3.8+ has no popup-* options anymore (popups are floating panes now),
# so the colors live in user options and the binds in tmux.conf read them
set -g @popup-style "bg=#181825"
set -g @popup-border-style "fg=#cba6f7,bg=#181825"
