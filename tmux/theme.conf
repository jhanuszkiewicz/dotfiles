# tmux colors - tokyo night
# this file is part of hswi presets (presets/files.txt)

# bar background = terminal background, so it looks flat
set -g status-style "bg=#1a1b26,fg=#565f89"

# left: session name, right: nothing (clock is already in sketchybar)
# session name on the left, but hidden for numbered sessions (1, 2, 6...)
# named ones (main, tms project sessions) are still shown
set -g status-left '#{?#{m/r:^[0-9]+$,#{session_name}},,#[fg=#7aa2f7#,bold] #S #[default] }'
set -g status-left-length 30
set -g status-right ""

# tabs
setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I #W "
setw -g window-status-activity-style "fg=#e0af68"

# pane borders - one quiet line, no blue half next to the active pane
set -g pane-border-indicators off
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#292e42"

# messages, command prompt and copy mode selection
set -g message-style "bg=#292e42,fg=#c0caf5"
setw -g mode-style "bg=#3b4261,fg=#c0caf5"

# popups (sessionizer, lazygit): darker background + thick accent border, so they stand out
# tmux 3.8+ has no popup-* options anymore (popups are floating panes now),
# so the colors live in user options and the binds in tmux.conf read them
set -g @popup-style "bg=#1f2335"
set -g @popup-border-style "fg=#7aa2f7,bg=#1f2335"
