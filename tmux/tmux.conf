# ~/.config/tmux/tmux.conf (symlink to ~/.dotfiles/tmux)
#
# skroty ponizej czyta skrypt `keys` (klawisze, min. 3 spacje, opis)
# prefix = ctrl + a (wciskasz go przed klawiszami "prefix + ...")
#
# Windows: tabs on the top bar = workspaces
#   alt + 1..9         go to window 1..9 (creates it if missing)
#   alt + n            new window
#   alt + w            close window
#   alt + , / .        previous / next window
#
# Panes
#   alt + h/j/k/l      move between panes
#   prefix + |         split side by side
#   prefix + -         split one under another
#   prefix + H/J/K/L   resize pane
#
# Other
#   prefix + r         rename window
#   prefix + R         reload config
#   prefix + [         copy mode (v select, y copy)

# ---------- basics ----------

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000

# numbering from 1 like the workspaces, no holes after closing one
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# window name = running program (zsh, nvim, btop...) until you rename it
setw -g automatic-rename on

# ---------- workspaces (no prefix) ----------

# like workspaces: if the window does not exist yet, it gets created
bind -n M-1 if-shell "tmux select-window -t :=1" "" "new-window -t :=1 -c '#{pane_current_path}'"
bind -n M-2 if-shell "tmux select-window -t :=2" "" "new-window -t :=2 -c '#{pane_current_path}'"
bind -n M-3 if-shell "tmux select-window -t :=3" "" "new-window -t :=3 -c '#{pane_current_path}'"
bind -n M-4 if-shell "tmux select-window -t :=4" "" "new-window -t :=4 -c '#{pane_current_path}'"
bind -n M-5 if-shell "tmux select-window -t :=5" "" "new-window -t :=5 -c '#{pane_current_path}'"
bind -n M-6 if-shell "tmux select-window -t :=6" "" "new-window -t :=6 -c '#{pane_current_path}'"
bind -n M-7 if-shell "tmux select-window -t :=7" "" "new-window -t :=7 -c '#{pane_current_path}'"
bind -n M-8 if-shell "tmux select-window -t :=8" "" "new-window -t :=8 -c '#{pane_current_path}'"
bind -n M-9 if-shell "tmux select-window -t :=9" "" "new-window -t :=9 -c '#{pane_current_path}'"

bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-w confirm-before -p "close window #W? (y/n)" kill-window
bind -n M-, previous-window
bind -n M-. next-window

# ---------- panes ----------

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind r command-prompt -I "#W" "rename-window '%%'"
bind R source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# copy mode like vim (prefix [ , v select, y copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ---------- look ----------

set -g status-position top
set -g status-interval 5
set -g status-justify left

# colors live in a separate file so hswi presets can swap them
source-file ~/.config/tmux/theme.conf

# ---------- lazygit ----------
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# ---------- useful binds ---------
set -g detach-on-destroy off     # zamkniecie ostatniej karty przelacza na inna sesje zamiast wyrzucac z tmuxa
set -g set-clipboard on          # kopiowanie z tmuxa (np. przez ssh) trafia do schowka macOS
set -g allow-passthrough on      # podglad obrazkow w yazi wewnatrz tmuxa
setw -g aggressive-resize on     # karta nie kurczy sie do najmniejszego podpietego okna
bind c new-window -c "#{pane_current_path}"
bind x kill-pane                 # bez pytania o potwierdzenie
bind -T copy-mode-vi C-v send -X rectangle-toggle   # zaznaczanie prostokatem
